[project]
name = "gpu-stress-test"
version = "0.1.0"
description = "Configurable GPU stress testing, calibration, and performance reports"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "pytorch-lightning>=2.2,<3",
    "matplotlib>=3.7,<4",
]

[tool.uv]
package = false
required-version = "==0.11.24"

# Match the existing CUDA 12.4 stack on Linux/Windows x86-64.
# Other platforms use the PyPI build (CPU/MPS where available).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and platform_machine == 'AMD64'" },
    { index = "pytorch-cu124", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
